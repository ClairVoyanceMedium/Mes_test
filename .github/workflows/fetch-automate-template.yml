name: Extract Automate primitive serializer

on:
  push:
    paths:
      - '.github/workflows/fetch-automate-template.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and decompile
        run: |
          set -euo pipefail
          mkdir -p /tmp/apks
          docker run --rm -v /tmp/apks:/output ghcr.io/efforg/apkeep:stable -a com.llamalab.automate /output >/tmp/apkeep.log 2>&1
          APK="$(find /tmp/apks -type f -name '*.apk' | head -n1)"
          curl -fSL --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip' -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --show-bad-code --output-dir /tmp/jadx-out "$APK" >/tmp/jadx.log 2>&1 || true
      - name: Copy serializers
        run: |
          set -euo pipefail
          mkdir -p automate_reverse/matches/d4 automate_reverse/matches/R3
          cp /tmp/jadx-out/sources/d4/C1724e.java automate_reverse/matches/d4/
          cp /tmp/jadx-out/sources/d4/C1725f.java automate_reverse/matches/d4/
          cp /tmp/jadx-out/sources/R3/c.java automate_reverse/matches/R3/
          cp /tmp/jadx-out/sources/R3/d.java automate_reverse/matches/R3/
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automate_reverse/matches/d4 automate_reverse/matches/R3
          git diff --cached --quiet || git commit -m 'Extract Automate primitive serializer'
          git push
