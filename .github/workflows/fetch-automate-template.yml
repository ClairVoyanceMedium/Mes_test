name: Fetch Automate templates

on:
  push:
    paths:
      - '.github/workflows/fetch-automate-template.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official community flows
        run: |
          set -euo pipefail
          mkdir -p automate_templates
          curl --fail --location --retry 3 'https://llamalab.com/automate/community/api/v1/flows/371/data/Voice%2Bcommand%2Bexample%2B%231.flo' --output automate_templates/voice_command_example.flo
          curl --fail --location --retry 3 'https://llamalab.com/automate/community/api/v1/flows/47403/data/Google%2BAssistant%2BAudio%2BFeedback%2B%2528Galaxy%2BZ%2BFold2%2529.flo' --output automate_templates/assistant_foreground_example.flo
          curl --fail --location --retry 3 'https://llamalab.com/automate/community/api/v1/flows/44245/data/Google%2BAssistant%2Bon%2BAutomate%2BV1.0.flo' --output automate_templates/assistant_interact_example.flo
          curl --fail --location --retry 3 'https://llamalab.com/automate/community/api/v1/flows/45973/data/F13%2BTriggers%2BAssistant%2BListen.flo' --output automate_templates/assistant_listen_example.flo
          for f in automate_templates/*.flo; do
            test "$(head -c 4 "$f")" = "LAFl"
          done
      - name: Commit templates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automate_templates/*.flo
          git diff --cached --quiet || git commit -m 'Add Automate Assistant templates'
          git push
