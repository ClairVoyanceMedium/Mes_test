name: Extract Automate classes

on:
  push:
    paths:
      - '.github/workflows/extract-automate-classes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Automate APK
        run: |
          set -euo pipefail
          mkdir -p /tmp/apks
          docker run --rm -v /tmp/apks:/output ghcr.io/efforg/apkeep:stable -a com.llamalab.automate /output
          APK="$(find /tmp/apks -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" /tmp/automate.apk
      - name: Decompile
        run: |
          set -euo pipefail
          curl -fSL --retry 3 'https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip' -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --show-bad-code --output-dir /tmp/jadx-out /tmp/automate.apk || true
          test -d /tmp/jadx-out/sources
      - name: Copy serializer sources
        run: |
          set -euo pipefail
          rm -rf automate_extract
          mkdir -p automate_extract/R3 automate_extract/stmt automate_extract/core automate_extract/J3 automate_extract/L3 automate_extract/d4 automate_extract/expr_func automate_extract/system automate_extract/flow_io
          cp /tmp/jadx-out/sources/R3/c.java automate_extract/R3/
          cp /tmp/jadx-out/sources/R3/d.java automate_extract/R3/
          cp /tmp/jadx-out/sources/R3/g.java automate_extract/R3/
          cp /tmp/jadx-out/sources/d4/C1724e.java automate_extract/d4/
          cp /tmp/jadx-out/sources/d4/C1725f.java automate_extract/d4/
          cp /tmp/jadx-out/sources/com/llamalab/automate/A2.java automate_extract/core/
          cp /tmp/jadx-out/sources/com/llamalab/automate/InterfaceC1700x0.java automate_extract/core/
          cp /tmp/jadx-out/sources/com/llamalab/automate/L0.java automate_extract/core/
          cp /tmp/jadx-out/sources/com/llamalab/automate/K0.java automate_extract/core/
          cp /tmp/jadx-out/sources/J3/*.java automate_extract/J3/
          cp /tmp/jadx-out/sources/L3/*.java automate_extract/L3/
          cp /tmp/jadx-out/sources/com/llamalab/automate/stmt/*.java automate_extract/stmt/
          cp /tmp/jadx-out/sources/com/llamalab/automate/expr/func/*.java automate_extract/expr_func/
          cp /tmp/jadx-out/sources/com/llamalab/android/system/MoreOsConstants.java automate_extract/system/
          grep -RIl 'LAFl' /tmp/jadx-out/sources --include='*.java' | while read -r file; do
            rel="${file#/tmp/jadx-out/sources/}"
            safe="${rel//\//__}"
            cp "$file" "automate_extract/flow_io/$safe"
          done
      - name: Commit sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automate_extract
          git diff --cached --quiet || git commit -m 'Extract Automate flow file reader and writer'
          git push
